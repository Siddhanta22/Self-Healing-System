<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Self-Healing Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <header class="app-header">
      <h1>Self-Healing Assistant</h1>
      <nav>
        <a href="/">Dashboard</a>
      </nav>
    </header>

    <main class="container">
      <section class="card">
        <h2>Ask about your errors</h2>
        <p class="subtitle">Get plain-English explanations and fixes, grounded in your actual error logs.</p>

        <div id="chat-window" class="chat-window">
          <div class="msg assistant">
            <div class="bubble">Hi! Ask me about a recent error, a specific error code, or general database stats.</div>
          </div>
        </div>

        <form id="chat-form">
          <div class="chat-input-row">
            <textarea name="question" placeholder="Ask about an error, database stats, or employees…" rows="2" required></textarea>
            <button type="submit">Send</button>
          </div>
          <label class="checkbox">
            <input type="checkbox" name="include_recent" checked /> Include recent error logs as context
          </label>
        </form>
      </section>

      <details class="advanced">
        <summary>Advanced: run a read-only SQL query</summary>
        <form id="query-form">
          <textarea name="query" placeholder="SELECT COUNT(*) FROM employee;" rows="3" required></textarea>
          <button type="submit">Execute Query</button>
        </form>
        <div id="query-result" class="answer"></div>
      </details>
    </main>

    <script>
      const chatWindow = document.getElementById('chat-window');

      function appendMessage(role, text, isError) {
        const msg = document.createElement('div');
        msg.className = `msg ${role}${isError ? ' error' : ''}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        msg.appendChild(bubble);
        chatWindow.appendChild(msg);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        return bubble;
      }

      async function sendChat(ev) {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        const question = fd.get('question');
        if (!question) return;
        const payload = {
          question,
          include_recent: fd.get('include_recent') === 'on'
        };

        appendMessage('user', question);
        ev.target.reset();
        ev.target.querySelector('input[name="include_recent"]').checked = true;
        const thinkingBubble = appendMessage('assistant', 'Thinking…');

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const body = await res.json();
          if (res.ok) {
            thinkingBubble.textContent = body.answer;
          } else {
            thinkingBubble.parentElement.classList.add('error');
            thinkingBubble.textContent = `${body.error || 'chat failed'}`;
          }
        } catch (e) {
          thinkingBubble.parentElement.classList.add('error');
          thinkingBubble.textContent = `${e}`;
        }
      }

      async function executeQuery(ev) {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        const payload = { query: fd.get('query') };
        const result = document.getElementById('query-result');
        result.textContent = 'Executing…';
        try {
          const res = await fetch('/api/db-query', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const body = await res.json();
          if (res.ok) {
            const data = JSON.stringify(body.result, null, 2);
            result.textContent = `Rows: ${body.row_count}\n\n${data}`;
          } else {
            result.textContent = `${body.error || 'query failed'}`;
          }
        } catch (e) {
          result.textContent = `${e}`;
        }
      }

      document.getElementById('chat-form').addEventListener('submit', sendChat);
      document.getElementById('query-form').addEventListener('submit', executeQuery);
    </script>
  </body>
</html>
